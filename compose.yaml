services:
  fngbot:
    build: .
    restart: unless-stopped
    environment:
      # Taken from .env next to this file, so the secrets stay out of config.yaml.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./config.yaml:/config.yaml:ro
      - fngbot-data:/data

volumes:
  fngbot-data:
