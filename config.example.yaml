# Конфигурация Fear & Greed бота.
# Скопируйте в config.yaml и подставьте свои значения.

# Как часто опрашивать индексы. Формат Go duration, плюс дни: 30m, 4h, 1d, 1d12h.
interval: 4h

# Отслеживаемые индексы: crypto (крипторынок) и stocks (акции США).
# Секцию можно удалить, тогда этот индекс не отслеживается; нужна хотя бы одна.
#
# alerts — ключевые уровни индекса (0–100), у каждого индекса свои:
#   fear  — уведомить, когда индекс опустился до уровня или ниже (индекс <= уровень);
#   greed — уведомить, когда индекс поднялся до уровня или выше (индекс >= уровень).
# На каждую сторону можно задать несколько уровней, например fear: [25, 10].
# Одну из сторон можно не указывать.
crypto:
  # alternative — официальный бесплатный API alternative.me (по умолчанию);
  # coinglass   — данные страницы coinglass.com (неофициально, через расшифровку ответа сайта).
  # Это разные индексы с разной методикой, поэтому значения у источников не совпадают.
  source: alternative
  alerts:
    fear: [19]
    greed: [81]

stocks:
  # cnn — CNN Fear & Greed Index (edition.cnn.com/markets/fear-and-greed), пока единственный источник.
  source: cnn
  alerts:
    fear: [20]
    greed: [80]

dedup:
  # Не повторять уведомление по той же стороне (fear/greed) того же индекса чаще,
  # чем раз в cooldown. Исключение: индекс дошёл до более глубокого уровня той же стороны (25 → 10).
  cooldown: 2d
  # file — время последних уведомлений хранится в JSON-файле и переживает рестарт;
  # memory — только в памяти процесса.
  storage: file
  file: data/state.json

telegram:
  # Токен бота от @BotFather. Можно не хранить в файле, а передать в TELEGRAM_BOT_TOKEN.
  bot_token: "123456789:REPLACE_WITH_YOUR_BOT_TOKEN"

  # Куда слать — один из двух вариантов, задать оба сразу нельзя.
  #
  # 1. Чат: id пользователя, группы (-100...) или @имя_канала. Или TELEGRAM_CHAT_ID.
  chat_id: "123456789"
  group_chat_id: "-1001234567890"
  topic_id: "8457"
  #
  # 2. Топик группы с включёнными темами. Уберите chat_id и раскомментируйте:
  #    group_chat_id — id группы (-100...), или TELEGRAM_GROUP_CHAT_ID;
  #    topic_id      — id топика (message_thread_id), или TELEGRAM_TOPIC_ID.
  #                    Без topic_id сообщения уходят в общий чат группы.
  # group_chat_id: "-1001234567890"
  # topic_id: 42
