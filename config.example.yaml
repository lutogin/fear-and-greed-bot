# Конфигурация Fear & Greed бота.
# Скопируйте в config.yaml и подставьте свои значения.

# Источник индекса:
#   alternative — официальный бесплатный API alternative.me (по умолчанию);
#   coinglass   — данные страницы coinglass.com (неофициально, через расшифровку ответа сайта).
# Это разные индексы с разной методикой, поэтому значения у источников не совпадают.
source: alternative

# Как часто опрашивать индекс. Формат Go duration, плюс дни: 30m, 4h, 1d, 1d12h.
interval: 4h

# Ключевые уровни индекса (0–100cspel).
#   fear  — уведомить, когда индекс опустился до уровня или ниже (индекс <= уровень);
#   greed — уведомить, когда индекс поднялся до уровня или выше (индекс >= уровень).
# На каждую сторону можно задать несколько уровней, например fear: [25, 10].
# Одну из сторон можно не указывать.
alerts:
  fear: [20]
  greed: [80]

dedup:
  # Не повторять уведомление по той же стороне (fear/greed) чаще, чем раз в cooldown.
  # Исключение: индекс дошёл до более глубокого уровня той же стороны (25 → 10).
  cooldown: 2d
  # file — время последних уведомлений хранится в JSON-файле и переживает рестарт;
  # memory — только в памяти процесса.
  storage: file
  file: data/state.json

telegram:
  # Токен бота от @BotFather. Можно не хранить в файле, а передать в TELEGRAM_BOT_TOKEN.
  bot_token: "123456789:REPLACE_WITH_YOUR_BOT_TOKEN"
  # Кому слать: id пользователя, группы (-100...) или @имя_канала. Или TELEGRAM_CHAT_ID.
  chat_id: "123456789"
